apply plugin: 'com.android.application'

// Yayın imzalama bilgileri repoya GİRMEZ. Öncelik sırası:
//   1) keystore.properties (android/ altında, .gitignore'da)
//   2) ortam değişkenleri (CI için: FITAI_KEYSTORE_FILE, FITAI_KEYSTORE_PASSWORD,
//      FITAI_KEY_ALIAS, FITAI_KEY_PASSWORD)
// Hiçbiri yoksa release imzasız kalır ve bundleRelease bilinçli olarak durur;
// böylece yanlışlıkla imzasız bir AAB Play'e yüklenmez.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def keystorePath = keystoreProperties['storeFile'] ?: System.getenv('FITAI_KEYSTORE_FILE')
def keystorePass = keystoreProperties['storePassword'] ?: System.getenv('FITAI_KEYSTORE_PASSWORD')
def keystoreAlias = keystoreProperties['keyAlias'] ?: System.getenv('FITAI_KEY_ALIAS')
def keystoreAliasPass = keystoreProperties['keyPassword'] ?: System.getenv('FITAI_KEY_PASSWORD')
def hasReleaseSigning = keystorePath && keystorePass && keystoreAlias && keystoreAliasPass

android {
    namespace = "com.fitai.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fitai.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePass
                keyAlias keystoreAlias
                keyPassword keystoreAliasPass
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            // Capacitor eklentileri reflection ile yüklendiği için kod küçültme
            // varsayılan olarak KAPALI (Capacitor'ın kendi şablonuyla aynı).
            // Açmadan önce proguard-rules.pro'daki keep kurallarının yeterli
            // olduğunu gerçek cihazda doğrulayın: R8 bir eklentiyi silerse hata
            // derlemede değil, çalışma anında ortaya çıkar.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// İmzasız bir yayın paketi Play Console tarafından reddedilir; hatayı derleme
// anında verip yükleme adımında keşfedilmesini önlüyoruz.
tasks.whenTaskAdded { task ->
    if (task.name == 'bundleRelease' || task.name == 'assembleRelease') {
        task.doFirst {
            if (!hasReleaseSigning) {
                throw new GradleException(
                    "Yayın imzalama yapılandırılmamış. android/keystore.properties olusturun " +
                    "(storeFile/storePassword/keyAlias/keyPassword) veya FITAI_KEYSTORE_* ortam " +
                    "degiskenlerini tanimlayin. Ayrinti: README > Android yayini."
                )
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
